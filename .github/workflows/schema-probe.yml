# Probelauf der Studienauswahl - fragt ab, schreibt nichts.
#
# Ruft `update_studies.py --probe` auf: PubMed abfragen, das Modell auswaehlen
# lassen, Anzahl und Felder melden. Kein Commit, kein Push, kein Newsletter -
# der Lauf ist deshalb auch an einem Tag gefahrlos, an dem die Ausgabe schon
# terminiert ist.
#
# Gedacht zum Pruefen von Schema- und Prompt-Aenderungen, bevor sie nachts
# scharf laufen. Nur von Hand startbar, kein Zeitplan.
name: Schema-Probe (nur von Hand)

on:
  workflow_dispatch:

permissions:
  contents: read            # bewusst nur lesen - dieser Lauf darf nichts aendern

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # thema.py liegt weiterhin in scripts/, die gemeinsamen Skripte in
      # scripts/gemeinsam/. Beide muessen importierbar sein: update_studies.py
      # laeuft drueben und importiert thema von hier, mailchimp_entwurf.py
      # laeuft hier und importiert torwaechter und sponsoren von drueben.
      PYTHONPATH: scripts:scripts/gemeinsam

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      # Die gemeinsamen Skripte liegen seit dem 04.09.2026 nicht mehr in jedem
      # Portal, sondern einmal in mvf-portal/hub-scripts. Geholt wird der Zweig
      # `stabil` - nicht `main`: Auf main wird entwickelt, und ein Commit dort
      # soll nicht am naechsten Morgen ungeprueft in zwoelf Portalen laufen.
      # Ausgerollt wird mit `git push origin main:stabil` im Skript-Repo.
      - name: Gemeinsame Skripte auschecken
        uses: actions/checkout@v4
        with:
          repository: mvf-portal/hub-scripts
          ref: stabil
          path: scripts/gemeinsam

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install --quiet "anthropic>=0.40" requests tzdata

      - name: Auswahl probeweise abfragen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.LONGEVITYHUB }}
          MODEL: claude-haiku-4-5
        run: python scripts/gemeinsam/update_studies.py --probe
